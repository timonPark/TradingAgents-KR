# Task 12b (#99): KRX 전용 하드 포크 (ADR-0001) — Claude Code 헤드리스 단일
# 백엔드. 상류의 ``ollama`` / ``tradingagents-ollama`` 서비스와 ``ollama`` 프로파
# 일, ``ollama_data`` 볼륨은 전부 제거되었습니다.
#
# 호스트의 Claude Code OAuth credential (``~/.claude/.credentials.json``) 을 **읽기
# 전용** 으로 공유해 컨테이너 내부에서 ``claude -p`` 호출 가능. 호스트 ``~/.claude``
# 디렉터리 전체는 **공유되지 않습니다** (오염 방지, docker/entrypoint.sh 참조).
services:
  tradingagents:
    build: .
    # env_file 은 유지하지만 외부 LLM API 키 (ANTHROPIC_API_KEY / OPENAI_API_KEY /
    # GEMINI_API_KEY 등) 는 **참조되지 않습니다**. Max/Pro 플랜 쿼터는 Claude Code
    # OAuth 가 담당하므로 .env 에는 TRADINGAGENTS_* 환경변수와 vendor 키
    # (DART_API_KEY / ECOS_API_KEY) 만 필요합니다.
    env_file:
      - .env
    environment:
      # entrypoint 가 HOME 아래 .claude/.credentials.json 을 symlink 로 걸므로
      # 컨테이너 내부 쓰기 가능한 임시 HOME 지정.
      - HOME=/tmp/claude-home
    volumes:
      # 호스트 OAuth credential 을 읽기전용으로 공유. 호스트 ~/.claude 디렉터리
      # 전체를 공유하지 않아 컨테이너 종료 시 호스트 상태 오염 없음. 호스트에
      # credential 이 아직 없으면 `claude login` 을 먼저 실행하세요.
      - ${HOME}/.claude/.credentials.json:/claude-auth/.credentials.json:ro
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

volumes:
  tradingagents_data:
