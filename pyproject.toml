[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
dynamic = ["version"]
description = "TradingAgents-KR: Multi-Agents LLM Financial Trading Framework (Korean Market, Claude Code backend)"
readme = "README.md"
requires-python = ">=3.11"
# TradingAgents-KR 는 Claude Code 헤드리스를 유일 LLM 백엔드로 사용합니다
# (ADR-0001). langchain-anthropic / langchain-openai / langchain-google-genai /
# langchain-aws 는 Task 2 (#21) 에서 제거되었습니다. 어댑터는 subprocess 호출
# 로 claude CLI 를 구동하며 langchain-core 의 BaseChatModel 인터페이스만
# 사용합니다.
dependencies = [
    "cryptography>=42.0",
    "langchain-core>=1.6.5",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "markdown-it-py>=4.0",
    "packaging>=24.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=1.7.0",
    # Task 5 (#46): 금융감독원 Open DART 를 통해 KRX 상장사의 재무/공시 데이터
    # 조회. ``DART_API_KEY`` 환경변수로 인증. 0.3+ 는 py3.13+ 요구, 그 이전 py
    # 버전은 0.2.x 로 폴백되며 패키지 레이아웃이 다름 (0.3: ``opendartreader``,
    # 0.2: ``OpenDartReader``). ``vendors/dart.py`` 가 두 레이아웃 모두 처리.
    "OpenDartReader>=0.2",
    # Task 5 (#46): ``pandas.DataFrame.to_markdown`` 가 백엔드로 요구하는 포매터.
    # DART vendor 가 재무제표를 Markdown 표로 렌더링할 때 사용.
    "tabulate>=0.9",
    # Task 6 (#51): KRX 시세·기술지표·투자자별 수급. OHLCV 는 keyless, 수급은
    # ``KRX_ID`` / ``KRX_PW`` 환경변수 요구. pykrx 1.2.x 는 pandas<3.0 을
    # 선언하지만 OHLCV 경로는 pandas 3.x 와 호환 — 설치 시 경고 뜨지만 vendor
    # 는 정상 동작. 상충은 ``vendors/pykrx.py`` 가 흡수.
    "pykrx>=1.0.49",
    # Task 6 (#51): pykrx 가 ``pkg_resources`` (레거시 setuptools API) 를
    # import. py3.12+ 는 setuptools 를 기본 번들하지 않고, setuptools 81+ 는
    # ``pkg_resources`` 를 제거함. 우리 pandas>=3.0 제약과 상충해 pip 가 자동으로
    # 선택하는 pykrx 1.0.x (레거시) 가 pkg_resources 를 요구하므로 setuptools 를
    # 80.x 이하로 묶어 pkg_resources 를 유지. pykrx 가 1.2+ 로 안정화되면 (pandas
    # 3.0 지원) 이 핀은 제거 가능.
    "setuptools>=68,<81",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.setuptools.dynamic]
version = {attr = "tradingagents.__version__"}

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]
tradingagents = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not integration\""
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services; run only when asked for, with -m integration",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor imports in router.py) instead of one statement per name.
combine-as-imports = true
